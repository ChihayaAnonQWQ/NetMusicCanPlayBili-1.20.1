# Gradle 运行参数。
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=true
# ForgeGradle 的 MinecraftUserRepo 按需生成 AT 产物，与并行任务执行存在竞态，
# 会让 compileClasspath 在产物写完前就去解析。移植期固定串行。
org.gradle.parallel=false
org.gradle.caching=true

# 用 JDK 21 运行 Gradle：Temurin 17.0.20.1 在低完整性工作区上会把可写文件
# 误判为只读（Files.isWritable=false），导致 ForgeGradle 的 zipfs 写入失败。
# 编译目标仍锁定 Java 17 字节码（见 build.gradle 的 options.release）。
org.gradle.java.home=C:/Program Files/Java/jdk-21
# ForgeGradle 生成 Minecraft 产物时会内部调用 JavaCompile，必须能解析到 JDK 17。
org.gradle.java.installations.paths=C:/Users/ChihayaAnon/Documents/deepseek-harness/default-workspace/work/tools/jdk17/jdk-17.0.20.1+1

## Environment Properties
minecraft_version=1.20.1
# 1.20.1 最后一个 Forge 构建。
forge_version=1.20.1-47.4.26
# NetMusic 1.20.1 Forge 依赖（Modrinth version id）。
netmusic_version=QbkPicTz
# Iris 1.20.1（可选编译期依赖，用于着色器兼容）。
iris_version=1.7.0+1.20.1

## Mod Properties
mod_id=net_music_can_play_bili
mod_name=Net Music Can Play Bili
mod_license=MIT
mod_version=0.7.10-beta
mod_authors=zhongbai233
mod_description=Adds Bilibili video audio playback support to NetMusic. Paste a Bilibili video link (BV/av) into a music CD and it will play the audio directly.
mod_group_id=com.zhongbai233
